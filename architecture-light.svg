" font-weight="600" fill="#1f2328">NAT Gateway</text><text x="664.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">outbound for both subnets</text><rect x="40" y="640" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><g transform="translate(60,680.0) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g><text x="104.0" y="691.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Microsoft Entra ID</text><text x="104.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">mcloud-admin, AAD DC Administrators</text><rect x="1160" y="640" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><g transform="translate(1180,680.0) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="1224.0" y="691.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Blob Storage</text><text x="1224.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">ad-join.ps1, Custom Script Ext.</text></svg>